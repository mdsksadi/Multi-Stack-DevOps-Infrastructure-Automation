name: Build and Deploy Voting App to EKS

on:
  push:
    branches:
      - project2-eks-deployment

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: voting-app-eks-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: eks-sadi
  K8S_NAMESPACE: voting-app
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-deploy:
    name: Build Images and Deploy to EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Login to Docker Hub
        uses: docker/login-action@e468171a9de216ec08956ac3ada2f0791b6bd435
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Vote image
        uses: docker/build-push-action@e468171a9de216ec08956ac3ada2f0791b6bd435
        with:
          context: ./vote
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vote:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/vote:latest

      - name: Build and push Result image
        uses: docker/build-push-action@e468171a9de216ec08956ac3ada2f0791b6bd435
        with:
          context: ./result
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/result:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/result:latest

      - name: Build and push Worker image
        uses: docker/build-push-action@e468171a9de216ec08956ac3ada2f0791b6bd435
        with:
          context: ./worker
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/worker:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/worker:latest

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@e468171a9de216ec08956ac3ada2f0791b6bd435
        with:
          role-to-assume: arn:aws:iam::686699774218:role/GitHubActionsEKSDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Deploy images to EKS
        run: |
          kubectl set image deployment/vote \
            vote="$DOCKERHUB_USERNAME/vote:${GITHUB_SHA}" \
            -n "$K8S_NAMESPACE"

          kubectl set image deployment/result \
            result="$DOCKERHUB_USERNAME/result:${GITHUB_SHA}" \
            -n "$K8S_NAMESPACE"

          kubectl set image deployment/worker \
            worker="$DOCKERHUB_USERNAME/worker:${GITHUB_SHA}" \
            -n "$K8S_NAMESPACE"

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/vote \
            -n "$K8S_NAMESPACE" --timeout=180s

          kubectl rollout status deployment/result \
            -n "$K8S_NAMESPACE" --timeout=180s

          kubectl rollout status deployment/worker \
            -n "$K8S_NAMESPACE" --timeout=180s

      - name: Show deployed images
        run: |
          kubectl get deployments -n "$K8S_NAMESPACE" \
            -o custom-columns='DEPLOYMENT:.metadata.name,IMAGE:.spec.template.spec.containers[*].image'
